services:
  - type: web
    name: tin-cup
    runtime: ruby
    plan: free
    region: virginia
    branch: main
    buildCommand: bash bin/render-build.sh
    startCommand: bash bin/render-start.sh
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: tin-cup-db
          property: connectionString

databases:
  - name: tin-cup-db
    plan: free
    region: virginia
    databaseName: tin_cup_db
    user: tin_cup_db_user
    ipAllowList: []
